# Overrides for standard mode - balanced module selection

# Username module is disabled - using GitHub username instead
# See github-modules.toml for custom.github_username configuration

# custom.git_commit and custom.memory shell out on every prompt render;
# terminal/compact modes already disable them (see their overrides files) - match that here.
custom.git_commit.disabled = true
custom.memory.disabled = true

# All other modules use default settings from shared modules
# This file can be expanded for any standard-mode specific customizations