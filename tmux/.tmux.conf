# Tmux Configuration with Gruvbox Theme

# ============================================
# General Settings
# ============================================

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Extended keys: pass modified keys (e.g. Shift+Enter) through to apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable vi mode
setw -g mode-keys vi

# Faster command sequences
set -s escape-time 0

# Enable focus events for better vim/nvim integration
set -g focus-events on

# Allow Ghostty shell integration OSC sequences to pass through to the terminal
set -g allow-passthrough all

# Forward OSC 52 clipboard writes from nested apps (SSH'd vim, nested tmux, etc.)
# to the outer terminal's clipboard. Ghostty has clipboard-write=allow to receive.
set -g set-clipboard on

# Aggressive resize for multiple clients
set -g window-size latest

# Attach to the next existing session instead of exiting when the last window closes
set -g detach-on-destroy off

# Sync Ghostty titlebar with active tmux session and window
set -g set-titles on
set -g set-titles-string "#S · #W"

# Window names: show current directory basename instead of command name
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Resolve dotfiles repo root from the Stow symlink so #() helpers in the
# status bar (e.g. scripts/process-icon) can be referenced without baking in
# a user-specific absolute path. ~/.tmux.conf -> <repo>/tmux/.tmux.conf, so
# two dirnames above realpath give the repo root. Stored in tmux's global env
# and inherited by every #() shell invocation.
run-shell 'tmux setenv -g DOTFILES_DIR "$(dirname "$(dirname "$(realpath ~/.tmux.conf)")")"'

# ============================================
# Key Bindings
# ============================================

# Change prefix from C-b to C-a (more comfortable)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window inherits cwd (matches split behavior above)
bind c new-window -c "#{pane_current_path}"

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator: prefix-free Ctrl+h/j/k/l cross nvim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Vi-style pane resize (repeatable; mirrors h/j/k/l navigation above)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Vi-style copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Enhanced cross-platform clipboard integration
if-shell "uname | grep -q Darwin" \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind-key -T copy-mode-vi C-y send-keys -X copy-pipe "pbcopy"; \
   bind-key ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"; \
   bind-key -T copy-mode-vi C-y send-keys -X copy-pipe "xclip -in -selection clipboard"'

# Double-click selects word, triple-click selects line. Works both from a live
# pane (enters copy mode first) and from within copy mode. tmux only emits up
# to TripleClick1Pane, so this is the natural ceiling.
if-shell "uname | grep -q Darwin" \
  'bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"; \
   bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"; \
   bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"; \
   bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"' \
  'bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"; \
   bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"; \
   bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"; \
   bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"'

# prefix+Y: copy entire scrollback (start of history → end) to clipboard.
# prefix+y: copy from the last shell prompt to bottom of history. Requires OSC 133
# prompt marks, which Ghostty's zsh shell-integration emits and tmux 3.5+ honors.
if-shell "uname | grep -q Darwin" \
  'bind Y run-shell "tmux capture-pane -p -S - -E - | pbcopy && tmux display-message \"Scrollback copied\""; \
   bind y copy-mode \; send-keys -X previous-prompt \; send-keys -X begin-selection \; send-keys -X history-bottom \; send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind Y run-shell "tmux capture-pane -p -S - -E - | xclip -in -selection clipboard && tmux display-message \"Scrollback copied\""; \
   bind y copy-mode \; send-keys -X previous-prompt \; send-keys -X begin-selection \; send-keys -X history-bottom \; send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# Exit copy-mode with q or Escape; click focuses pane without exiting
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDown1Pane select-pane

# Reorder windows left/right (swap, so occupied indices never block)
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Pane synchronization toggle
bind S set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Floating scratch terminal (opens at current pane's path, closes on shell exit)
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E zsh

# Floating lazygit (Cmd+G in Ghostty → prefix+G here)
bind G display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit

# btop system monitor popup (Cmd+M in Ghostty → prefix+M here)
bind M display-popup -d '#{pane_current_path}' -w 90% -h 90% -E btop

# fzf session switcher (leaves built-in prefix+s choose-tree untouched)
bind f display-popup -E "tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t"

# Project sessionizer (prefix+T → fuzzy-find ~/Projects, create/switch session)
bind T display-popup -w 60% -h 40% -E "tmux-sessionizer"

# Clear visible content and wipe tmux scrollback ring buffer (fired by Cmd+K in Ghostty)
bind C-l send-keys -R C-l \; clear-history

# ============================================
# Gruvbox Theme (auto dark/light)
# ============================================
# Auto-detects macOS appearance; override with THEME_MODE=light or THEME_MODE=dark

# Pane border format (shared); status toggled conditionally by hooks below
set -g pane-border-format " #{pane_index} #{?pane_title,#{pane_title},#{pane_current_command}} "

# Show pane borders only when a window has more than one pane
set-hook -g window-layout-changed \
  'if "[ #{window_panes} -gt 1 ]" \
    "setw pane-border-status top" \
    "setw pane-border-status off"'
set-hook -g after-new-window 'setw pane-border-status off'

# Force a status redraw when entering/exiting copy mode so tmux-prefix-highlight
# swaps "^A" for "Copy" immediately instead of waiting for status-interval.
set-hook -g pane-mode-changed 'refresh-client -S'

# Shared status bar settings
set -g status-position top
set -g status-interval 5
set -g status-justify left

# --- Gruvbox Dark / Light Theme ---
# Condition: dark if THEME_MODE=dark, or if THEME_MODE unset and macOS is in dark mode,
# or if THEME_MODE unset and not on macOS (Linux defaults to dark).
if-shell \
  '_m=${THEME_MODE}; if [ -z "$_m" ]; then if uname | grep -q Darwin && defaults read -g AppleInterfaceStyle 2>/dev/null | grep -qi dark; then _m=dark; elif uname | grep -q Darwin; then _m=light; else _m=dark; fi; fi; [ "$_m" = "dark" ]' \
  'set -g status-style bg=#282828,fg=#ebdbb2; \
   setw -g window-status-style bg=#282828,fg=#928374; \
   setw -g window-status-current-style bg=#504945,fg=#fe8019,bold; \
   setw -g window-status-activity-style bg=#282828,fg=#fabd2f; \
   setw -g window-status-bell-style bg=#282828,fg=#fb4934,bold; \
   set -g pane-border-style fg=#3c3836; \
   set -g pane-active-border-style fg=#b8bb26; \
   set -g message-style bg=#504945,fg=#ebdbb2; \
   set -g status-left-length 40; \
   set -g status-left "#[bg=#504945,fg=#ebdbb2,bold] #{session_name} #[bg=#282828,fg=#504945]#[bg=#282828,fg=#928374] #{host_short} "; \
   set -g status-right-length 80; \
   set -g @prefix_highlight_fg "#282828"; \
   set -g @prefix_highlight_bg "#fe8019"; \
   set -g @prefix_highlight_show_copy_mode "on"; \
   set -g @prefix_highlight_copy_mode_attr "fg=#282828,bg=#fabd2f"; \
   set -g status-right "#{prefix_highlight}#[fg=#928374] CPU #{cpu_percentage}  RAM #{ram_percentage} #[fg=#a89984]| #[fg=#a89984]%I:%M %p %d-%b-%y "; \
   setw -g window-status-format " #[fg=#928374]#{?#{@pane_icon},#{@pane_icon} ,}#I:#W#{?window_zoomed_flag,#[fg=#fabd2f]Z,#F} "; \
   setw -g window-status-current-format " #[fg=#fe8019,bold]#{?#{@pane_icon},#{@pane_icon} ,}#I:#W#{?window_zoomed_flag,#[fg=#fabd2f]Z,#F} "; \
   setw -g window-status-separator " "' \
  'set -g status-style bg=#f9f5d7,fg=#3c3836; \
   setw -g window-status-style bg=#f9f5d7,fg=#928374; \
   setw -g window-status-current-style bg=#d5c4a1,fg=#af3a03,bold; \
   setw -g window-status-activity-style bg=#f9f5d7,fg=#b57614; \
   setw -g window-status-bell-style bg=#f9f5d7,fg=#9d0006,bold; \
   set -g pane-border-style fg=#bdae93; \
   set -g pane-active-border-style fg=#79740e; \
   set -g message-style bg=#d5c4a1,fg=#3c3836; \
   set -g status-left-length 40; \
   set -g status-left "#[bg=#d5c4a1,fg=#3c3836,bold] #{session_name} #[bg=#f9f5d7,fg=#d5c4a1]#[bg=#f9f5d7,fg=#928374] #{host_short} "; \
   set -g status-right-length 80; \
   set -g @prefix_highlight_fg "#f9f5d7"; \
   set -g @prefix_highlight_bg "#af3a03"; \
   set -g @prefix_highlight_show_copy_mode "on"; \
   set -g @prefix_highlight_copy_mode_attr "fg=#f9f5d7,bg=#b57614"; \
   set -g status-right "#{prefix_highlight}#[fg=#928374] CPU #{cpu_percentage}  RAM #{ram_percentage} #[fg=#7c6f64]| #[fg=#7c6f64]%I:%M %p %d-%b-%y "; \
   setw -g window-status-format " #[fg=#928374]#{?#{@pane_icon},#{@pane_icon} ,}#I:#W#{?window_zoomed_flag,#[fg=#b57614]Z,#F} "; \
   setw -g window-status-current-format " #[fg=#af3a03,bold]#{?#{@pane_icon},#{@pane_icon} ,}#I:#W#{?window_zoomed_flag,#[fg=#b57614]Z,#F} "; \
   setw -g window-status-separator " "'

# ============================================
# Tmux Plugin Manager (TPM)
# ============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Plugin settings
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# extrakto: fzf any visible token (URLs, paths, hashes, words). Default trigger: prefix + Tab.
set -g @extrakto_clip_tool "pbcopy"
set -g @extrakto_grab_area "window recent"

# tmux-notify: desktop notification when a monitored pane's command finishes (prefix + m)
set -g @tnotify-sleep-duration 2
set -g @tnotify-prompt-length 30

# which-key: navigable prefix+? popup (config mirrors all bindings below)
set -g @which-key-config "$HOME/.config/tmux/which-key.yaml"

# CPU monitoring styling (conditional — same detection logic as theme block above)
if-shell \
  '_m=${THEME_MODE}; if [ -z "$_m" ]; then if uname | grep -q Darwin && defaults read -g AppleInterfaceStyle 2>/dev/null | grep -qi dark; then _m=dark; elif uname | grep -q Darwin; then _m=light; else _m=dark; fi; fi; [ "$_m" = "dark" ]' \
  'set -g @cpu_low_fg_color "#b8bb26"; \
   set -g @cpu_medium_fg_color "#fabd2f"; \
   set -g @cpu_high_fg_color "#fb4934"; \
   set -g @cpu_low_bg_color "#282828"; \
   set -g @cpu_medium_bg_color "#282828"; \
   set -g @cpu_high_bg_color "#282828"' \
  'set -g @cpu_low_fg_color "#79740e"; \
   set -g @cpu_medium_fg_color "#b57614"; \
   set -g @cpu_high_fg_color "#9d0006"; \
   set -g @cpu_low_bg_color "#f9f5d7"; \
   set -g @cpu_medium_bg_color "#f9f5d7"; \
   set -g @cpu_high_bg_color "#f9f5d7"'

# Auto-install TPM on first run (complements scripts/setup-tmux-plugins.sh)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
