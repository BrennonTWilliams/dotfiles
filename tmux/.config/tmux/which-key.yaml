title: "  tmux bindings"
presentation: "page"
macros: {}
items:
  # ── Panes ────────────────────────────────────────────────────────────────
  - name: "split right"
    key: "|"
    command: "split-window -h -c '#{pane_current_path}'"
  - name: "split down"
    key: "-"
    command: "split-window -v -c '#{pane_current_path}'"
  - name: "focus left"
    key: "h"
    command: "select-pane -L"
  - name: "focus down"
    key: "j"
    command: "select-pane -D"
  - name: "focus up"
    key: "k"
    command: "select-pane -U"
  - name: "focus right"
    key: "l"
    command: "select-pane -R"
  - name: "resize left"
    key: "H"
    command: "resize-pane -L 5"
  - name: "resize down"
    key: "J"
    command: "resize-pane -D 2"
  - name: "resize up"
    key: "K"
    command: "resize-pane -U 2"
  - name: "resize right"
    key: "L"
    command: "resize-pane -R 5"
  - name: "zoom toggle"
    key: "z"
    type: key
  - name: "kill pane"
    key: "x"
    type: key
  - name: "swap pane up"
    key: "{"
    type: key
  - name: "swap pane down"
    key: "}"
    type: key
  - name: "sync panes"
    key: "S"
    command: "set-window-option synchronize-panes"
  # ── Windows ──────────────────────────────────────────────────────────────
  - name: "new window"
    key: "c"
    command: "new-window -c '#{pane_current_path}'"
  - name: "window left"
    key: "<"
    command: "swap-window -t -1 \\; select-window -t -1"
  - name: "window right"
    key: ">"
    command: "swap-window -t +1 \\; select-window -t +1"
  - name: "rename window"
    key: ","
    type: key
  - name: "kill window"
    key: "&"
    type: key
  - name: "next window"
    key: "n"
    type: key
  - name: "prev window"
    key: "p"
    type: key
  - name: "next layout"
    key: "Space"
    type: key
  # ── Sessions ─────────────────────────────────────────────────────────────
  - name: "rename session"
    key: "$"
    type: key
  - name: "detach"
    key: "d"
    type: key
  - name: "fzf switch"
    key: "f"
    command: "display-popup -E \"tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t\""
  # ── Popups ───────────────────────────────────────────────────────────────
  - name: "zsh scratch"
    key: "g"
    command: "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E zsh"
  - name: "lazygit"
    key: "G"
    command: "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit"
  - name: "btop"
    key: "M"
    command: "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E btop"
  # ── Copy / Extract ────────────────────────────────────────────────────────
  - name: "copy mode"
    key: "["
    type: key
  - name: "paste buffer"
    key: "]"
    type: key
  - name: "extrakto"
    key: "Tab"
    type: key
  # ── Utility ───────────────────────────────────────────────────────────────
  - name: "reload config"
    key: "r"
    command: "source-file ~/.tmux.conf"
  - name: "clear scrollback"
    key: "C-l"
    command: "send-keys -R C-l \\; clear-history"
